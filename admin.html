<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextraStore Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { font-family: 'Prompt', system-ui; }
  body { background: #0a0a0f; color: #e5e7eb; min-height: 100vh; }
  .glass { background: rgba(15, 15, 25, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
  .gradient-text { background: linear-gradient(135deg, #a78bfa, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn-glow { box-shadow: 0 0 20px rgba(167, 139, 250, 0.3); transition: all 0.3s; }
  .nav-active { background: rgba(167, 139, 250, 0.15); border-left: 3px solid #a78bfa; }
  .icon { width: 22px; height: 22px; stroke-width: 2; }
  .icon-sm { width: 16px; height: 16px; stroke-width: 2; }
  .icon-lg { width: 36px; height: 36px; stroke-width: 1.8; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #a78bfa; border-radius: 3px; }
</style>
</head>
<body>

<nav class="fixed top-0 left-0 right-0 z-50 glass">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
        <svg class="icon text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1 class="font-bold text-white text-sm">NextraStore Admin</h1>
    </div>
    <div class="flex gap-2">
      <a href="/" class="text-gray-300 hover:text-white text-sm">← หน้าเว็บ</a>
      <button onclick="logout()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded text-sm">ออก</button>
    </div>
  </div>
</nav>

<div class="flex pt-14">
  <aside class="w-56 min-h-screen p-3 hidden md:block">
    <div class="glass rounded-xl p-2 sticky top-20">
      <nav class="space-y-1">
        <a onclick="showTab('dashboard')" data-tab="dashboard" class="admin-nav block px-3 py-2 rounded-lg hover:bg-white/5 cursor-pointer text-gray-300 text-sm">📊 Dashboard</a>
        <a onclick="showTab('members')" data-tab="members" class="admin-nav block px-3 py-2 rounded-lg hover:bg-white/5 cursor-pointer text-gray-300 text-sm">👥 ลูกค้า</a>
        <a onclick="showTab('sites')" data-tab="sites" class="admin-nav block px-3 py-2 rounded-lg hover:bg-white/5 cursor-pointer text-gray-300 text-sm">🌐 เว็บ</a>
        <a onclick="showTab('payments')" data-tab="payments" class="admin-nav block px-3 py-2 rounded-lg hover:bg-white/5 cursor-pointer text-gray-300 text-sm">💰 รายได้</a>
      </nav>
    </div>
  </aside>
  <main class="flex-1 p-4">
    <div id="admin-dashboard" class="admin-content">
      <h2 class="text-2xl font-black text-white mb-4">Dashboard</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div class="glass rounded-xl p-4"><p class="text-xs text-gray-400">ลูกค้า</p><p class="text-2xl font-black text-white mt-1" id="statMembers">0</p></div>
        <div class="glass rounded-xl p-4"><p class="text-xs text-gray-400">เว็บ</p><p class="text-2xl font-black gradient-text mt-1" id="statSites">0</p></div>
        <div class="glass rounded-xl p-4"><p class="text-xs text-gray-400">รายได้/ด</p><p class="text-xl font-black text-green-400 mt-1" id="statMRR">฿0</p></div>
        <div class="glass rounded-xl p-4"><p class="text-xs text-gray-400">รายได้รวม</p><p class="text-xl font-black text-orange-400 mt-1" id="statTotal">฿0</p></div>
      </div>
      <div class="glass rounded-xl p-4">
        <h3 class="font-bold text-white mb-3 text-sm">การเช่าล่าสุด</h3>
        <div id="recentList" class="space-y-2"></div>
      </div>
    </div>

    <div id="admin-members" class="admin-content hidden">
      <h2 class="text-2xl font-black text-white mb-4">ลูกค้า</h2>
      <div class="glass rounded-xl p-3 overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 text-xs border-b border-white/10"><th class="py-2 px-2">ชื่อ</th><th class="py-2 px-2">User</th><th class="py-2 px-2">Wallet</th><th class="py-2 px-2">จ่าย</th><th class="py-2 px-2">จัดการ</th></tr></thead>
          <tbody id="membersTable"></tbody>
        </table>
      </div>
    </div>

    <div id="admin-sites" class="admin-content hidden">
      <h2 class="text-2xl font-black text-white mb-4">เว็บทั้งหมด</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="sitesGrid"></div>
    </div>

    <div id="admin-payments" class="admin-content hidden">
      <h2 class="text-2xl font-black text-white mb-4">รายได้</h2>
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="glass rounded-xl p-4"><p class="text-xs text-gray-400">วันนี้</p><p class="text-xl font-black text-white mt-1" id="revToday">฿0</p></div>
        <div class="glass rounded-xl p-4"><p class="text-xs text-gray-400">เดือน</p><p class="text-xl font-black gradient-text mt-1" id="revMonth">฿0</p></div>
        <div class="glass rounded-xl p-4"><p class="text-xs text-gray-400">ทั้งหมด</p><p class="text-xl font-black text-green-400 mt-1" id="revAll">฿0</p></div>
      </div>
      <div class="glass rounded-xl p-3 overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 text-xs border-b border-white/10"><th class="py-2 px-2">วันที่</th><th class="py-2 px-2">ลูกค้า</th><th class="py-2 px-2">แพ็กเกจ</th><th class="py-2 px-2">จำนวน</th></tr></thead>
          <tbody id="paymentsTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="hidden fixed top-20 right-5 px-4 py-2 rounded-xl shadow-2xl z-50 text-white text-sm bg-gradient-to-r from-green-500 to-emerald-500"></div>

<script>
const API = '';
let token = localStorage.getItem('ns_token');

function showToast(msg, color='green') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `fixed top-20 right-5 px-4 py-2 rounded-xl shadow-2xl z-50 text-white text-sm slide-up bg-gradient-to-r ${color==='green'?'from-green-500 to-emerald-500':color==='red'?'from-red-500 to-pink-500':'from-purple-500 to-pink-500'}`;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

async function api(url, method='GET', body=null) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(API + url, { method, headers, body: body ? JSON.stringify(body) : null });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error');
  return data;
}

function logout() {
  localStorage.removeItem('ns_token'); localStorage.removeItem('ns_user');
  window.location.href = '/';
}

function showTab(tab) {
  document.querySelectorAll('.admin-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.admin-nav').forEach(el => el.classList.remove('nav-active'));
  document.getElementById('admin-' + tab).classList.remove('hidden');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('nav-active');
  if (tab === 'dashboard') loadDash();
  if (tab === 'members') loadMembers();
  if (tab === 'sites') loadSites();
  if (tab === 'payments') loadPayments();
}

async function loadDash() {
  try {
    const stats = await api('/api/admin/stats');
    document.getElementById('statMembers').textContent = stats.totalMembers;
    document.getElementById('statSites').textContent = stats.totalSites;
    document.getElementById('statMRR').textContent = '฿' + stats.monthRevenue.toLocaleString();
    document.getElementById('statTotal').textContent = '฿' + stats.totalRevenue.toLocaleString();
    
    const data = await api('/api/admin/sites');
    document.getElementById('recentList').innerHTML = data.sites.slice(0, 5).map(s => `
      <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 text-sm">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-orange-500 flex items-center justify-center text-xs text-white font-bold">${s.shopname.charAt(0)}</div>
        <div class="flex-1 min-w-0"><div class="font-bold text-white truncate">${s.shopname}</div><div class="text-xs text-gray-400 truncate">${s.username}</div></div>
        <div class="text-xs gradient-text font-bold">฿${s.price}</div>
      </div>
    `).join('') || '<p class="text-gray-500 text-sm text-center py-4">ยังไม่มี</p>';
  } catch (e) { showToast(e.message, 'red'); if (e.message.includes('token') || e.message.includes('Admin')) window.location.href = '/'; }
}

async function loadMembers() {
  try {
    const data = await api('/api/admin/members');
    document.getElementById('membersTable').innerHTML = data.members.map(m => `
      <tr class="border-b border-white/5">
        <td class="py-2 px-2 text-white">${m.name} ${m.role==='admin'?'<span class="text-orange-400 text-xs">★</span>':''}</td>
        <td class="py-2 px-2 text-gray-400 font-mono text-xs">@${m.username}</td>
        <td class="py-2 px-2 text-yellow-400 font-bold">฿${m.wallet.toLocaleString()}</td>
        <td class="py-2 px-2 text-green-400">฿${m.total_spent.toLocaleString()}</td>
        <td class="py-2 px-2">
          <button onclick="topupMember(${m.id})" class="text-cyan-400 text-xs mr-2">+เติม</button>
          <button onclick="deleteMember(${m.id})" class="text-red-400 text-xs">ลบ</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="5" class="text-center text-gray-500 py-4">ไม่มีข้อมูล</td></tr>';
  } catch (e) { showToast(e.message, 'red'); }
}

async function topupMember(id) {
  const amount = parseInt(prompt('จำนวนเงินที่จะเติม:', '100'));
  if (!amount || amount <= 0) return;
  try {
    await api('/api/admin/topup', 'POST', { memberId: id, amount });
    showToast('เติมเงินสำเร็จ');
    loadMembers();
  } catch (e) { showToast(e.message, 'red'); }
}

async function deleteMember(id) {
  if (!confirm('ลบสมาชิกนี้?')) return;
  try {
    await api('/api/admin/members/' + id, 'DELETE');
    showToast('ลบแล้ว');
    loadMembers();
  } catch (e) { showToast(e.message, 'red'); }
}

async function loadSites() {
  try {
    const data = await api('/api/admin/sites');
    document.getElementById('sitesGrid').innerHTML = data.sites.map(s => `
      <div class="glass rounded-xl p-3">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-pink-500 to-orange-500 flex items-center justify-center"><span class="text-xs text-white font-bold">${s.shopname.charAt(0)}</span></div>
          <div class="flex-1 min-w-0"><h4 class="font-bold text-white text-sm truncate">${s.shopname}</h4><p class="text-xs text-gray-400 truncate">${s.domain}.nextrastore.com</p></div>
        </div>
        <div class="grid grid-cols-3 gap-1 text-center text-xs">
          <div class="bg-white/5 rounded p-1"><div class="text-gray-400">แพ็ก</div><div class="text-white font-bold">${(s.plan||'').toUpperCase()}</div></div>
          <div class="bg-white/5 rounded p-1"><div class="text-gray-400">สินค้า</div><div class="text-white font-bold">${s.products.length}</div></div>
          <div class="bg-white/5 rounded p-1"><div class="text-gray-400">ออเดอร์</div><div class="text-white font-bold">${s.orders.length}</div></div>
        </div>
        <p class="text-xs text-gray-500 mt-2">👤 ${s.username}</p>
      </div>
    `).join('') || '<p class="text-gray-500 text-sm col-span-2 text-center py-4">ยังไม่มี</p>';
  } catch (e) { showToast(e.message, 'red'); }
}

async function loadPayments() {
  try {
    const data = await api('/api/admin/payments');
    const todayRev = data.payments.filter(p => new Date(p.created_at).toDateString() === new Date().toDateString()).reduce((s,p) => s + p.amount, 0);
    const monthRev = data.payments.filter(p => new Date(p.created_at).getMonth() === new Date().getMonth()).reduce((s,p) => s + p.amount, 0);
    const totalRev = data.payments.reduce((s,p) => s + p.amount, 0);
    document.getElementById('revToday').textContent = '฿' + todayRev.toLocaleString();
    document.getElementById('revMonth').textContent = '฿' + monthRev.toLocaleString();
    document.getElementById('revAll').textContent = '฿' + totalRev.toLocaleString();
    document.getElementById('paymentsTable').innerHTML = data.payments.map(p => `
      <tr class="border-b border-white/5">
        <td class="py-2 px-2 text-gray-400 text-xs">${new Date(p.created_at).toLocaleString('th-TH')}</td>
        <td class="py-2 px-2 text-white">${p.username}</td>
        <td class="py-2 px-2"><span class="px-2 py-0.5 rounded text-xs bg-purple-500/20 text-purple-300">${p.plan.toUpperCase()}</span></td>
        <td class="py-2 px-2 text-green-400 font-bold">฿${p.amount.toLocaleString()}</td>
      </tr>
    `).join('') || '<tr><td colspan="4" class="text-center text-gray-500 py-4">ไม่มี</td></tr>';
  } catch (e) { showToast(e.message, 'red'); }
}

window.addEventListener('load', () => {
  if (!token) { window.location.href = '/'; return; }
  showTab('dashboard');
});
</script>

</body>
</html>
